# Dependabot — generated for lang=python. See docs for tuning.
version: 2
updates:
  # One entry for every Python dependency. It also finds the substrate tool pins in
  # scripts/substrate-requirements.txt (consumers get those with kit upgrades), so a
  # second entry for /scripts opened each bump twice, once without the cooldown.
  - package-ecosystem: "pip"
    directory: "/"
    schedule: {interval: "weekly"}
    # cryptography signs releases: let a new version age a week before it is proposed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels: ["dependencies", "python"]
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: {interval: "weekly"}
    open-pull-requests-limit: 3
    labels: ["dependencies", "ci"]
    # One PR a week for every action bump: the kit's workflow templates must follow
    # each bump, which `./manage.sh sync-pins` does in one step (v3.10.6).
    groups:
      actions:
        patterns: ["*"]
