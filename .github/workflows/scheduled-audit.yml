name: Scheduled audit
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      pytest_timeout:
        description: "Seconds the audit's pytest run may take (60-1800; empty = default 1200). A small value forces a TIMEOUT to test the alert path."
        required: false
        default: ""
jobs:
  scheduled-audit:
    runs-on: ubuntu-latest
    # Room for the longest pytest limit (1800 s) plus setup and the other checks,
    # so the audit reports TIMEOUT itself instead of being cancelled first.
    timeout-minutes: 45
    # This job runs repository code (setup, tests, hooks), so its token can only
    # read, and checkout does not leave it on disk.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: "3.11"}
      - name: Bootstrap toolchain
        run: |
          set -euo pipefail
          # Pinned tool versions (v3.10.6): scripts/substrate-requirements.txt.
          if [ -f pyproject.toml ]; then
            python -m pip install -c scripts/substrate-requirements.txt uv
            uv sync --group dev
          else
            python -m pip install -c scripts/substrate-requirements.txt pip PyYAML pre-commit
          fi
      - name: Substrate setup (so audit uses .substrate/venv tools, not ambient)
        run: ./manage.sh setup
      - name: Write substrate audit report
        id: audit
        # Passed through env, never interpolated into the script; the audit
        # rejects any value that is not whole seconds in range.
        env:
          SUBSTRATE_AUDIT_PYTEST_TIMEOUT: ${{ github.event.inputs.pytest_timeout }}
        run: ./manage.sh full-audit
      # Preserve the report — an ephemeral runner discards ai/audits/
      # otherwise. always() so a failing audit still uploads evidence.
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: substrate-audit-report
          path: ai/audits/**
          retention-days: 30
          if-no-files-found: warn

  # A separate job holds the only write scope and runs no repository code: no
  # checkout, just the GitHub API. Without `issues: write` this step was refused
  # with HTTP 403 on every failing run, so audit failures were silent (v3.10.2).
  # It also alerts when the audit job is cancelled (for example by its time limit).
  alert-on-failure:
    needs: scheduled-audit
    if: ${{ always() && needs.scheduled-audit.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open issue on audit failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          AUDIT_RESULT: ${{ needs.scheduled-audit.result }}
        with:
          script: |
            // One open issue per failure streak: later failures comment on it.
            const label = 'substrate-audit';
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({ ...context.repo, name: label,
                color: 'b60205', description: 'Scheduled substrate audit failed' });
            }
            const sha = context.sha.slice(0, 7);
            const body = `The scheduled substrate audit did not succeed (${process.env.AUDIT_RESULT}) on ${new Date().toISOString()} at ${sha}.\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nThe log names each check as PASS, BLOCK, TIMEOUT or NOT-RUN; download the \`substrate-audit-report\` artifact for the full report.`;
            // Only an issue this workflow opened, never a pull request or an issue
            // someone else labelled; if commenting fails (locked), open a new one.
            const open = await github.rest.issues.listForRepo({ ...context.repo,
              state: 'open', labels: label, per_page: 50 });
            const mine = open.data.find(i => !i.pull_request && i.user &&
              i.user.login === 'github-actions[bot]');
            let posted = false;
            if (mine) {
              try {
                await github.rest.issues.createComment({ ...context.repo,
                  issue_number: mine.number, body });
                posted = true;
              } catch (e) {
                core.warning(`could not comment on #${mine.number}: ${e.message}`);
              }
            }
            if (!posted) {
              await github.rest.issues.create({ ...context.repo,
                title: `Scheduled substrate audit failed (${sha})`, body, labels: [label] });
            }
