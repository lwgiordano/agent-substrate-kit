[project]
name = "substrate-init"
version = "0.1.0"
description = "Verify-then-install bootstrapper for the Agent Substrate Kit — the minisign trust key is embedded in this package (fork-proof first install)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["cryptography>=3.4"]

[project.scripts]
substrate-init = "substrate_init.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/substrate_init"]
# Force the embedded trust anchors (non-.py data) into the wheel — the minisign pubkey AND,
# when the kit signs keyless, sigstore_identity.json. Without them the package cannot verify
# and every install fails closed. Glob so a later keyless identity ships automatically. (v3.7.20)
artifacts = ["src/substrate_init/trust/*"]
