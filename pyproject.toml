[project]
name = "agent_substrate_kit_v3"
version = "0.0.0"
description = "Project bootstrapped with Agent Substrate Kit v3"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "pre-commit>=3.7",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-randomly>=3.15",
  "pytest-rerunfailures>=14.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "PyYAML>=6",
  "types-PyYAML>=6"
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Substrate-owned dirs are governed by the substrate's OWN chain (check_python_syntax,
# check_policy_code_integrity, harness/hook smoke, pytest) and use a deliberate, compact,
# integrity-PINNED style. Ruff's job in a substrate repo is to lint the PROJECT's code, not
# the vendored substrate — reformatting it would also churn the source-pinned security core.
# (mypy already excludes scripts/ for the same reason.) Excluding these dirs additionally
# stops the kit's own shipped scripts/tests from failing a consuming repo's pre-commit.
# `--force-exclude` in run_python_gate.sh makes this bind even when pre-commit passes the
# filenames explicitly.
# installer/ is excluded too: it vendors byte-identical copies of scripts/_minisign.py +
# the trust key, and a drift test asserts the match — letting ruff reformat only the copy
# (scripts/ is excluded) would break that invariant. (v3.7.15)
extend-exclude = ["scripts", "extras", "tests", "installer"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
exclude = ["scripts/", "build/", "dist/", "\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]
filterwarnings = ["default"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
